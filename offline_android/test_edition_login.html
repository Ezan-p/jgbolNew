<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>金箍棒ol测试版</title>
<body style="background:#171d28;color:#eee;font:20px sans-serif;text-align:center;padding:10%">
<p id="status">正在进入固定测试存档…</p>
<button id="retry" style="display:none;font-size:20px" onclick="enter()">重试</button>
<script>
function enter(){
 document.getElementById('retry').style.display='none';
 var xhr=new XMLHttpRequest();xhr.open('POST','/local-auth');xhr.timeout=20000;
 xhr.setRequestHeader('Content-Type','application/json');xhr.setRequestHeader('X-Local-CSRF','__CSRF__');
 function fail(){document.getElementById('status').textContent='测试存档连接失败，请重试';document.getElementById('retry').style.display='inline';}
 xhr.onload=function(){try{var r=JSON.parse(xhr.responseText);if(!r.ok||!window.LocalGame)throw Error();LocalGame.complete(r.token);}catch(e){fail();}};
 xhr.onerror=xhr.ontimeout=fail;xhr.send(JSON.stringify({action:'resume'}));
}enter();
</script></body></html>
