<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>金箍棒 · 本地账号</title><style>
*{box-sizing:border-box}body{margin:0;background:#171d28;color:#eef1f7;font:16px sans-serif;padding:20px}main{max-width:460px;margin:auto}h1{font-size:24px;margin:0 0 8px}p{color:#acb7c9;line-height:1.5;font-size:14px}label{display:block;margin-top:12px}input:not([type=checkbox]){width:100%;padding:12px;margin-top:6px;background:#242e40;border:1px solid #65728a;border-radius:6px;color:white;font-size:16px}button{padding:12px 20px;margin-top:16px;border:0;border-radius:6px;background:#eac581;color:#202634;font-size:16px}button+button{background:#34435b;color:white;margin-left:10px}#error{color:#ffb5a7;min-height:24px}#extra{display:none}small{color:#acb7c9}
</style><main><h1>金箍棒 · 本地登录</h1><p>账号仅保存在本机。每个账号拥有独立进度，退出游戏后存档保留。</p>
<form id="form"><label>账号<input id="username" autocomplete="username" maxlength="24" required placeholder="3–24 位字母、数字或下划线"></label><label>密码<input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required placeholder="至少 8 个字符"></label><div id="extra"><label>确认密码<input id="confirm" type="password" maxlength="128" autocomplete="new-password"></label><label><input id="inherit" type="checkbox"> 继承原来的“本地行者”存档（仅可绑定一次）</label><p>不勾选将创建全新存档。请妥善保存密码，本地账号不提供邮箱找回。</p></div><label><input id="remember" type="checkbox" checked> 下次免登录（30 天，仅此设备）</label><div id="error" role="alert"></div><button id="submit" type="submit">登录并进入</button><button id="toggle" type="button">注册新账号</button></form><button id="change" type="button">切换账号 / 取消免登录</button><p>记住账号后再次进入将自动登录，点击上方按钮可换号。若服务未连接，请运行“自动修复登录”。</p></main>
<script>
var registering=false,busy=false,skipAuto=false,autoTimer=null;
function el(id){return document.getElementById(id)}
el('toggle').onclick=function(){if(busy)return;clearTimeout(autoTimer);skipAuto=true;registering=!registering;el('extra').style.display=registering?'block':'none';el('submit').textContent=registering?'注册并进入':'登录并进入';el('toggle').textContent=registering?'已有账号，去登录':'注册新账号';el('error').textContent='';};
function authenticate(payload, automatic){
if(busy)return;busy=true;el('submit').disabled=true;el('error').textContent=automatic?'正在恢复登录…':'正在验证，请稍候…';
var xhr=new XMLHttpRequest();xhr.open('POST','/local-auth');xhr.setRequestHeader('Content-Type','application/json');xhr.setRequestHeader('X-Local-CSRF','__CSRF__');xhr.timeout=15000;
xhr.onload=function(){busy=false;el('submit').disabled=false;try{if(payload.action==='resume'&&skipAuto){authenticate({action:'forget'},false);return;}var r=JSON.parse(xhr.responseText);if(!r.ok){el('error').textContent=automatic?'':r.error;return;}if(payload.action==='forget'){el('error').textContent='已退出免登录，请选择账号登录';return;}if(!window.LocalGame)throw Error('请在游戏内使用本地登录窗口');el('password').value='';el('confirm').value='';LocalGame.complete(r.token);el('error').textContent='登录成功，正在进入游戏…';}catch(err){el('error').textContent=err.message;}};
xhr.onerror=xhr.ontimeout=function(){busy=false;el('submit').disabled=false;el('error').textContent='本地服务连接失败，请运行“自动修复登录”后重试';};xhr.send(JSON.stringify(payload));
}
el('form').onsubmit=function(e){e.preventDefault();clearTimeout(autoTimer);skipAuto=true;authenticate({action:registering?'register':'login',username:el('username').value.trim(),password:el('password').value,confirm:el('confirm').value,inherit:el('inherit').checked,remember:el('remember').checked},false);};
// The original game also calls switchAccount for ordinary entry. Only this
// explicit button revokes the remembered credential; ignore the legacy query.
el('change').onclick=function(){clearTimeout(autoTimer);skipAuto=true;if(!busy)authenticate({action:'forget'},false);};
el('username').onfocus=el('password').onfocus=function(){clearTimeout(autoTimer);skipAuto=true;};
if(window.LocalGame&&__AUTO_LOGIN__){el('error').textContent='3 秒后自动登录上次账号，可点击下方按钮切换账号';autoTimer=setTimeout(function(){if(!skipAuto)authenticate({action:'resume'},true);},3000);}
</script></html>
